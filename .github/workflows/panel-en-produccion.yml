# ¿Ya está en producción? Espera (hasta 30 min) a que el panel publicado en Railway sirva un
# texto que solo existe en el cambio nuevo (o a que deje de servir uno que se quitó) y dice a qué
# hora ocurrió. Busca en la página, el archivo principal y las partes que se cargan aparte. No cambia nada.
name: Panel · ¿Ya está en producción?

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/panel-en-produccion.yml']
  workflow_dispatch:
    inputs:
      texto:
        description: 'Texto a buscar en el panel publicado'
        required: true
      modo:
        description: 'presente = esperar a que aparezca · ausente = esperar a que desaparezca'
        required: false
        default: presente

permissions:
  contents: read

jobs:
  esperar:
    name: Esperar el despliegue
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # En un push de prueba: que PostHog ya no esté en el panel.
      TEXTO: ${{ github.event.inputs.texto || 'posthog' }}
      MODO: ${{ github.event.inputs.modo || 'ausente' }}
      PANEL: https://panel.iglesiavenyve.org
    steps:
      - name: Buscar en el panel publicado
        run: |
          found() {
            HTML=$(curl -fsS "$PANEL/r/PRUEBA?t=$(date +%s)") || return 2
            MAIN=$(echo "$HTML" | grep -o '/static/js/main\.[0-9a-f]*\.js' | head -1)
            WHERE="página (principal: ${MAIN:-?})"
            echo "$HTML" | grep -qi "$TEXTO" && return 0
            WHERE="$MAIN"
            [ -n "$MAIN" ] && curl -fsS "$PANEL$MAIN" | grep -qi "$TEXTO" && return 0
            for part in $(curl -fsS "$PANEL/asset-manifest.json" | grep -o '/static/js/[0-9]*\.[0-9a-f]*\.chunk\.js' | sort -u); do
              WHERE="$part"
              curl -fsS "$PANEL$part" | grep -qi "$TEXTO" && return 0
            done
            WHERE="ningún archivo (principal: ${MAIN:-?})"
            return 1
          }
          for i in $(seq 1 60); do
            STATE=0; found || STATE=$?  # «|| » evita que bash -e corte el paso cuando no se encuentra
            NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
            if [ "$STATE" = 2 ]; then echo "$NOW el panel no respondió";
            elif [ "$MODO" = ausente ] && [ "$STATE" = 1 ]; then echo "EN PRODUCCIÓN desde $NOW: «$TEXTO» ya no está en el panel"; exit 0;
            elif [ "$MODO" != ausente ] && [ "$STATE" = 0 ]; then echo "EN PRODUCCIÓN desde $NOW: «$TEXTO» ya está en el panel"; exit 0;
            else echo "$NOW todavía no · «$TEXTO» en: $WHERE"; fi
            sleep 30
          done
          echo "::error::Después de 30 minutos el panel todavía no tiene el cambio."
          exit 1
