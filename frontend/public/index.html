<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#0B1428" />
        <!-- Íconos de la iglesia (emblema del logo oficial sobre blanco): pestaña, iPhone/iPad y Android. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- Las páginas de visitantes cambian este manifest por el suyo (Registro / Bienvenida). -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" id="app-manifest" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Ven y Ve" id="apple-app-title" />
        <meta name="application-name" content="Ven y Ve" />
        <meta name="description" content="VEN Y VE 360 — Sistema Integral de Gestión Ministerial de Casa de Oración Ven y Ve." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet" />
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>VEN Y VE 360 | Sistema Integral de Gestión Ministerial</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!-- Nunca pantalla en blanco: si la app no arranca (navegador muy viejo o un error), a los
             15 segundos se muestra un aviso con el detalle. ES5 a propósito (funciona en cualquier navegador). -->
        <script>
          (function () {
            var errores = [];
            window.addEventListener("error", function (e) { errores.push((e && e.message) || "error"); });
            window.addEventListener("unhandledrejection", function (e) { errores.push("promesa: " + ((e && e.reason && e.reason.message) || e.reason)); });
            setTimeout(function () {
              var root = document.getElementById("root");
              if (!root || root.children.length) return;
              var chrome = (navigator.userAgent.match(/Chrome\/[0-9.]+/) || ["navegador desconocido"])[0];
              root.innerHTML = '<div style="font-family:sans-serif;max-width:640px;margin:12vh auto;padding:24px;text-align:center;color:#101D36" data-testid="app-start-error">' +
                '<h1 style="font-size:30px;margin:0 0 8px">La página no pudo abrirse</h1>' +
                '<p style="font-size:20px;color:#8A6A1F;margin:0 0 16px">The page could not open</p>' +
                '<p style="font-size:19px;color:#475467">Actualice el sistema de la tableta (Configuración › Opciones del dispositivo › Actualizaciones del sistema) e intente de nuevo.</p>' +
                '<p><a href="" style="display:inline-block;margin-top:16px;padding:18px 32px;border-radius:18px;background:#C8A951;color:#14213D;font-size:24px;font-weight:bold;text-decoration:none">Reintentar · Try again</a></p>' +
                '<p style="font-size:14px;color:#667085;margin-top:24px">Detalle: ' + chrome + (errores.length ? " · " + String(errores.slice(0, 3).join(" | ")).replace(/</g, "&lt;") : "") + "</p></div>";
            }, 15000);
          })();
        </script>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    </body>
</html>
