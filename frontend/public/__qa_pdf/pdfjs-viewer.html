<!doctype html>
<html>
<head><meta charset="utf-8"><title>QA PDF renderer</title><style>html,body{margin:0;background:#777}canvas{display:block;margin:16px auto;background:white;box-shadow:0 2px 10px #222}</style></head>
<body><main id="pages"></main><script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const file = new URLSearchParams(location.search).get('file');
const pdf = await pdfjsLib.getDocument(file).promise;
for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale: 2 });
  const canvas = document.createElement('canvas');
  canvas.dataset.page = String(pageNumber);
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  document.querySelector('#pages').appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
}
document.body.dataset.ready = 'true';
</script></body>
</html>
