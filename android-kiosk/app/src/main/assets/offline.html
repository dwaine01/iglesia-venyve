<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sin conexión</title>
<style>
  html, body { margin: 0; height: 100%; background: #F7F5EF; color: #101D36; font-family: system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: min(260px, 50vw); height: auto; }
  h1 { font-family: Georgia, serif; font-size: 40px; margin: 28px 0 4px; color: #14213D; }
  .en { font-size: 24px; color: #8A6A1F; font-weight: 700; margin: 0; }
  p { font-size: 22px; line-height: 1.4; color: #475467; max-width: 640px; margin: 16px 0 0; }
  a { display: inline-block; margin-top: 32px; min-width: 280px; padding: 26px 40px; border-radius: 24px; background: #C8A951; color: #14213D; font-size: 32px; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="emblema.png" alt="Casa de oración Ven y Ve">
  <h1>Sin conexión</h1>
  <p class="en">No connection</p>
  <p>La tableta no llega al registro. Revise el internet. Se volverá a intentar sola en unos segundos.</p>
  <p>The tablet cannot reach the registration. It will try again by itself in a few seconds.</p>
  <a href="registro://reintentar">Reintentar · Try again</a>
</main>
</body>
</html>
